services:
  postgres:
    image: postgres:17-bookworm
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2-bookworm
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /data:size=16m,mode=0700
    pids_limit: 50
    mem_limit: 192m

  kafka:
    image: confluentinc/cp-kafka:8.1.4
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    hostname: kafka
    ports:
      - '127.0.0.1:${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics --bootstrap-server 127.0.0.1:29092 --list > /dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1g

  kafka-init:
    image: confluentinc/cp-kafka:8.1.4
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic gatherly.domain-events.v1 --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic gatherly.domain-events.dlq.v1 --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --describe \
          --topic gatherly.domain-events.v1
        kafka-topics --bootstrap-server kafka:29092 --describe \
          --topic gatherly.domain-events.dlq.v1
    restart: 'no'

  outbox-publisher:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: node dist/workers/outbox-publisher.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PRISMA_POOL_MAX: ${PRISMA_POOL_MAX:-5}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-gatherly}
      KAFKA_DOMAIN_EVENTS_TOPIC: ${KAFKA_DOMAIN_EVENTS_TOPIC:-gatherly.domain-events.v1}
      KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS:-5000}
      KAFKA_OUTBOX_POLL_INTERVAL_MS: ${KAFKA_OUTBOX_POLL_INTERVAL_MS:-500}
      KAFKA_OUTBOX_BATCH_SIZE: ${KAFKA_OUTBOX_BATCH_SIZE:-25}
    depends_on:
      migration:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    pids_limit: 100
    mem_limit: 384m

  search-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: node dist/workers/search-projection-consumer.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PRISMA_POOL_MAX: ${PRISMA_POOL_MAX:-5}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-gatherly}
      KAFKA_DOMAIN_EVENTS_TOPIC: ${KAFKA_DOMAIN_EVENTS_TOPIC:-gatherly.domain-events.v1}
      KAFKA_DEAD_LETTER_TOPIC: ${KAFKA_DEAD_LETTER_TOPIC:-gatherly.domain-events.dlq.v1}
      KAFKA_SEARCH_GROUP_ID: ${KAFKA_SEARCH_GROUP_ID:-gatherly-search-projection-v1}
      KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS:-5000}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_REQUEST_TIMEOUT_MS: ${ELASTICSEARCH_REQUEST_TIMEOUT_MS:-2000}
      ELASTICSEARCH_INDEX_PREFIX: ${ELASTICSEARCH_INDEX_PREFIX:-gatherly-events}
    depends_on:
      migration:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    pids_limit: 100
    mem_limit: 384m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.enrollment.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --fail --silent http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s > /dev/null',
        ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1g

  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGPOOL_MAX: ${PGPOOL_MAX:-5}
      PRISMA_POOL_MAX: ${PRISMA_POOL_MAX:-5}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-gatherly-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gatherly-client}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
      EVENT_CACHE_TTL_SECONDS: ${EVENT_CACHE_TTL_SECONDS:-60}
      SSE_HEARTBEAT_INTERVAL_MS: ${SSE_HEARTBEAT_INTERVAL_MS:-15000}
      SSE_RETRY_MS: ${SSE_RETRY_MS:-3000}
      SSE_REPLAY_BATCH_SIZE: ${SSE_REPLAY_BATCH_SIZE:-100}
      SSE_MAX_CONNECTIONS_PER_USER: ${SSE_MAX_CONNECTIONS_PER_USER:-3}
      SSE_MAX_CONNECTION_DURATION_MS: ${SSE_MAX_CONNECTION_DURATION_MS:-600000}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_REQUEST_TIMEOUT_MS: ${ELASTICSEARCH_REQUEST_TIMEOUT_MS:-2000}
      ELASTICSEARCH_INDEX_PREFIX: ${ELASTICSEARCH_INDEX_PREFIX:-gatherly-events}
    ports:
      - '127.0.0.1:${APP_PORT}:3000'
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 100
    mem_limit: 512m

volumes:
  postgres_data:
  elasticsearch_data:
  kafka_data:
