create:
  post:
    tags: [Reservations]
    summary: Confirm a reservation or add the caller to the waitlist
    description: |
      Requires an active community membership, a bearer token, and an
      Idempotency-Key. Reusing a completed key returns its original outcome;
      an in-progress or differently reused key is rejected. Read a CONFIRMED
      result through the reservation resource and a WAITLISTED result through
      the waitlist resource.
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/EventId'
      - $ref: '../../openapi.yaml#/components/parameters/IdempotencyKey'
    responses:
      '201':
        description: The caller was confirmed or waitlisted.
        content:
          application/json:
            schema: { $ref: '../../openapi.yaml#/components/schemas/ReservationOutcomeResponse' }
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/AuthenticationRequired' }
      '403': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '409': { $ref: '../../openapi.yaml#/components/responses/Error' }
mine:
  get:
    tags: [Reservations]
    summary: Get the caller's active confirmed reservation
    description: Returns only a CONFIRMED reservation, not an active waitlist entry.
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/EventId'
    responses:
      '200':
        description: Active reservation returned.
        content:
          application/json:
            schema: { $ref: '../../openapi.yaml#/components/schemas/ReservationResponse' }
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/AuthenticationRequired' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
  delete:
    tags: [Reservations]
    summary: Cancel the caller's reservation and promote at most one waiting user
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/EventId'
    responses:
      '204': { description: Reservation cancelled and promotion committed if applicable. }
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/AuthenticationRequired' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
waitlist:
  get:
    tags: [Reservations]
    summary: Get the caller's active waitlist entry
    description: Use this resource when reservation creation returned WAITLISTED.
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/EventId'
    responses:
      '200':
        description: Active waiting entry returned.
        content:
          application/json:
            schema: { $ref: '../../openapi.yaml#/components/schemas/WaitlistEntryResponse' }
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/AuthenticationRequired' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
  delete:
    tags: [Reservations]
    summary: Cancel the caller's waitlist entry
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/EventId'
    responses:
      '204': { description: Waitlist entry cancelled. }
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/AuthenticationRequired' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
