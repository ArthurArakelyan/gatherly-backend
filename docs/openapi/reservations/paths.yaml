create:
  post:
    tags: [Reservations]
    summary: Confirm a reservation or add the caller to the waitlist
    description: |
      Requires an active community membership and an Idempotency-Key. Reusing the
      same key returns the stored original outcome and creates no duplicate effect.
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/EventId'
      - $ref: '../../openapi.yaml#/components/parameters/RequestUserId'
      - $ref: '../../openapi.yaml#/components/parameters/IdempotencyKey'
    responses:
      '201':
        description: The caller was confirmed or waitlisted.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  oneOf:
                    - $ref: '../../openapi.yaml#/components/schemas/ConfirmedOutcome'
                    - $ref: '../../openapi.yaml#/components/schemas/WaitlistedOutcome'
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '403': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '409': { $ref: '../../openapi.yaml#/components/responses/Error' }
mine:
  get:
    tags: [Reservations]
    summary: Get the caller's active confirmed reservation
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/EventId'
      - $ref: '../../openapi.yaml#/components/parameters/RequestUserId'
    responses:
      '200':
        description: Active reservation returned.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '../../openapi.yaml#/components/schemas/Reservation' }
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
  delete:
    tags: [Reservations]
    summary: Cancel the caller's reservation and promote at most one waiting user
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/EventId'
      - $ref: '../../openapi.yaml#/components/parameters/RequestUserId'
    responses:
      '204': { description: Reservation cancelled and promotion committed, if applicable. }
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
waitlist:
  get:
    tags: [Reservations]
    summary: Get the caller's active waitlist entry
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/EventId'
      - $ref: '../../openapi.yaml#/components/parameters/RequestUserId'
    responses:
      '200':
        description: Active waiting entry returned.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '../../openapi.yaml#/components/schemas/WaitlistEntry' }
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
  delete:
    tags: [Reservations]
    summary: Cancel the caller's waitlist entry
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/EventId'
      - $ref: '../../openapi.yaml#/components/parameters/RequestUserId'
    responses:
      '204': { description: Waitlist entry cancelled. }
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
