join:
  post:
    tags: [Memberships]
    summary: Join an open community
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/CommunityId'
    responses:
      '200':
        description: Caller was already an active member.
        content:
          application/json:
            schema: { $ref: '../../openapi.yaml#/components/schemas/MembershipStatusResponse' }
      '201':
        description: Membership created.
        content:
          application/json:
            schema: { $ref: '../../openapi.yaml#/components/schemas/MembershipStatusResponse' }
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/AuthenticationRequired' }
      '403': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '409': { $ref: '../../openapi.yaml#/components/responses/Error' }
leave:
  post:
    tags: [Memberships]
    summary: Leave a community while retaining membership history
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '../../openapi.yaml#/components/parameters/CommunityId'
    responses:
      '204': { description: Membership transitioned to LEFT. }
      '400': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '401': { $ref: '../../openapi.yaml#/components/responses/AuthenticationRequired' }
      '404': { $ref: '../../openapi.yaml#/components/responses/Error' }
      '409': { $ref: '../../openapi.yaml#/components/responses/Error' }
