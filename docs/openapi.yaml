openapi: 3.0.3
info:
  title: Gatherly API
  version: 0.1.0
  description: |
    The implemented API through the Phase 6 SSE increment. PostgreSQL is the
    durable source of truth; Redis accelerates disposable cache, throttling,
    and cross-instance realtime wake-ups.

    Identity is deliberately minimal: sign up or sign in with a username and
    password, then send the returned JWT in `Authorization: Bearer <token>` for
    protected endpoints. There is no development-only identity header.
servers:
  - url: http://localhost:3000
tags:
  - name: Health
    description: Process liveness and PostgreSQL readiness checks.
  - name: Identity
    description: Minimal username/password authentication.
  - name: Communities
    description: Public community discovery and authenticated community creation.
  - name: Memberships
    description: Authenticated community join and leave operations.
  - name: Events
    description: Public event discovery and authorized event creation.
  - name: Reservations
    description: Authenticated, capacity-safe reservations, waitlists, cancellation, and idempotency.
  - name: Realtime
    description: Authenticated one-way notification and organizer updates over SSE.
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Check whether the HTTP process is alive
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok }
  /health/ready:
    get:
      tags: [Health]
      summary: Check whether PostgreSQL is reachable
      responses:
        '200':
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ready }
        '503':
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: not_ready }
  /auth/sign-up:
    post:
      tags: [Identity]
      summary: Create an account and issue an access token
      description: |
        Limited to 5 requests per IP per hour. Successful responses include
        standard `RateLimit-*` response headers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account created and authenticated.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/UsernameTaken' }
        '429': { $ref: '#/components/responses/SignUpRateLimited' }
  /auth/sign-in:
    post:
      tags: [Identity]
      summary: Sign in and issue an access token
      description: |
        Limited to 10 requests per IP per 15 minutes. The same `401` response
        is returned for an unknown username and an incorrect password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Authenticated successfully.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticationResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '429': { $ref: '#/components/responses/SignInRateLimited' }
  /auth/me:
    get:
      tags: [Identity]
      summary: Get the currently authenticated user
      description: Returns the active user loaded while validating the bearer token.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /api/communities:
    get:
      tags: [Communities]
      summary: List active public communities
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated communities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityPage' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [Communities]
      summary: Create a community and an OWNER membership for the caller
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommunity' }
      responses:
        '201':
          description: Community created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '409': { $ref: '#/components/responses/Error' }
  /api/communities/{communityId}:
    get:
      tags: [Communities]
      summary: Get an active community
      parameters:
        - $ref: '#/components/parameters/CommunityId'
      responses:
        '200':
          description: Community returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/communities/{communityId}/join:
    post:
      tags: [Memberships]
      summary: Join an open community
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CommunityId'
      responses:
        '200':
          description: Caller was already an active member.
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/MembershipStatusResponse' } },
            }
        '201':
          description: Membership created.
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/MembershipStatusResponse' } },
            }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/communities/{communityId}/leave:
    post:
      tags: [Memberships]
      summary: Leave a community while retaining membership history
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CommunityId'
      responses:
        '204': { description: Membership transitioned to LEFT. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/communities/{communityId}/events:
    post:
      tags: [Events]
      summary: Create an event in a community
      description: Requires an active OWNER, ORGANIZER, or MODERATOR membership.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CommunityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEvent' }
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/events:
    get:
      tags: [Events]
      summary: List public published, cancelled, or completed events
      parameters:
        - { name: communityId, in: query, schema: { type: string, format: uuid } }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [PUBLISHED, CANCELLED, COMPLETED] },
          }
        - { name: startsAfter, in: query, schema: { type: string, format: date-time } }
        - { name: startsBefore, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated public events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '400': { $ref: '#/components/responses/Error' }
  /api/events/{eventId}:
    get:
      tags: [Events]
      summary: Get a public event
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/events/{eventId}/reservations:
    post:
      tags: [Reservations]
      summary: Confirm a reservation or add the caller to the waitlist
      description: |
        Requires an active community membership and an `Idempotency-Key`.
        Reusing a completed key returns its original outcome; an in-progress or
        differently reused key is rejected. A `CONFIRMED` result is available
        through `/api/events/{eventId}/reservations/me`; a `WAITLISTED` result
        is available through `/api/events/{eventId}/waitlist/me` instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The caller was confirmed or waitlisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationOutcomeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/events/{eventId}/reservations/me:
    get:
      tags: [Reservations]
      summary: Get the caller's active confirmed reservation
      description: Returns only a `CONFIRMED` reservation. Use the waitlist endpoint after a `WAITLISTED` creation result.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Active reservation returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Reservations]
      summary: Cancel the caller's reservation and promote at most one waiting user
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '204': { description: Reservation cancelled and promotion committed if applicable. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/Error' }
  /api/events/{eventId}/waitlist/me:
    get:
      tags: [Reservations]
      summary: Get the caller's active waitlist entry
      description: Use this resource when reservation creation returned `WAITLISTED`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Active waiting entry returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitlistEntryResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Reservations]
      summary: Cancel the caller's waitlist entry
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '204': { description: Waitlist entry cancelled. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/Error' }
  /api/realtime/stream:
    get:
      tags: [Realtime]
      summary: Open the authenticated realtime event stream
      description: |
        Sends UTF-8 Server-Sent Events. Authenticate with the bearer token in
        the `Authorization` header; do not place the token in the URL. A browser
        client therefore uses streaming `fetch` rather than native EventSource.

        After applying a durable event, reconnect with its SSE `id` in
        `Last-Event-ID`. The server replays visible PostgreSQL journal rows with
        greater IDs in ascending order. Delivery is at least once, so clients
        deduplicate using the event ID.

        Durable event names are `notification.created` for the authenticated
        user and `event.attendance.updated` for current active OWNER, ORGANIZER,
        or MODERATOR memberships. `stream.refresh-required` and `stream.closed`
        are connection controls without durable IDs. Comment frames are
        heartbeats.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Decimal ID of the last durable event successfully applied by the client.
          schema:
            type: string
            pattern: '^\d{1,19}$'
            example: '42'
      responses:
        '200':
          description: Long-lived SSE stream with retry advice, heartbeats, and visible events.
          headers:
            Cache-Control:
              description: Prevents caching and intermediary transformation.
              schema: { type: string, example: 'no-cache, no-transform' }
            X-Accel-Buffering:
              description: Advises a future Nginx proxy not to buffer the stream.
              schema: { type: string, enum: ['no'] }
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                retry: 3000

                id: 42
                event: notification.created
                data: {"notification":{"id":"b9d1ef65-d5d2-4f52-bb7c-173819b739e4","type":"RESERVATION_CONFIRMED","title":"Reservation confirmed","message":"Reservation confirmed","data":{"eventId":"6a85187e-953a-46ac-b95f-44967f2615ba"},"readAt":null,"createdAt":"2026-08-12T10:00:00.000Z"}}

                : heartbeat 2026-08-12T10:00:15.000Z

        '400':
          description: '`Last-Event-ID` is malformed, negative, or outside PostgreSQL BIGINT range.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '429':
          description: Per-user live connection limit reached (`SSE_CONNECTION_LIMIT`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The selected application instance is draining (`SERVER_DRAINING`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token returned by `/auth/sign-up` or `/auth/sign-in`.
  parameters:
    CommunityId:
      name: communityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key for one reservation intent.
      schema: { type: string, minLength: 1, maxLength: 200 }
      example: reserve-3af4d1c5-251b-4d41-a3a4-4f1f6dd2a1a7
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  headers:
    RateLimitLimit:
      description: Maximum allowed requests in the current rate-limit window.
      schema: { type: integer, minimum: 0 }
    RateLimitRemaining:
      description: Requests remaining in the current rate-limit window.
      schema: { type: integer, minimum: 0 }
    RateLimitReset:
      description: Seconds until the rate-limit window resets.
      schema: { type: integer, minimum: 0 }
    RateLimitPolicy:
      description: Applied rate-limit policy.
      schema: { type: string }
  schemas:
    Health:
      type: object
      required: [status]
      properties: { status: { type: string } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string, format: uuid }
            details: {}
      example:
        error:
          code: VALIDATION_ERROR
          message: Request validation failed
          requestId: 080f081c-d9a5-4a8d-8dd8-1d74f0137e55
          details:
            issues:
              - path: body.capacity
                message: 'Too small: expected number to be >0'
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          pattern: '^[a-z0-9_]{3,30}$'
          description: Trimmed and lower-cased before validation.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
      example: { username: alice, password: correct-horse-battery-staple }
    PublicUser:
      type: object
      required: [id, username, status, platformRole, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DELETED] }
        platformRole: { type: string, enum: [USER, PLATFORM_MODERATOR, PLATFORM_ADMIN] }
        createdAt: { type: string, format: date-time }
    AuthenticationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, accessToken, tokenType, expiresIn]
          properties:
            user: { $ref: '#/components/schemas/PublicUser' }
            accessToken: { type: string, description: JWT access token. }
            tokenType: { type: string, enum: [Bearer] }
            expiresIn: { type: integer, minimum: 1, description: Token lifetime in seconds. }
    CurrentUserResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties: { user: { $ref: '#/components/schemas/PublicUser' } }
    Community:
      type: object
      required: [id, name, slug, description, city, country, createdByUserId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true }
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CommunityResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Community' } }
    CommunityPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Community' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    CreateCommunity:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 3, maxLength: 100 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, maxLength: 2000, default: '' }
        city: { type: string, minLength: 1, maxLength: 100 }
        country: { type: string, minLength: 2, maxLength: 100 }
    MembershipStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties: { status: { type: string, enum: [ACTIVE] } }
    Event:
      type: object
      required:
        [
          id,
          communityId,
          createdByUserId,
          title,
          slug,
          description,
          format,
          status,
          visibility,
          startsAt,
          endsAt,
          timezone,
          capacity,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        communityId: { type: string, format: uuid }
        createdByUserId: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        description: { type: string }
        format: { type: string, enum: [IN_PERSON, ONLINE, HYBRID] }
        status: { type: string, enum: [PUBLISHED, CANCELLED, COMPLETED] }
        visibility: { type: string, enum: [PUBLIC, COMMUNITY_ONLY, INVITE_ONLY] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        capacity: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EventResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Event' } }
    EventPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Event' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    CreateEvent:
      type: object
      additionalProperties: false
      required: [title, slug, startsAt, endsAt, timezone, capacity]
      properties:
        title: { type: string, minLength: 3, maxLength: 150 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, maxLength: 10000, default: '' }
        format: { type: string, enum: [IN_PERSON, ONLINE, HYBRID], default: IN_PERSON }
        visibility: { type: string, enum: [PUBLIC, COMMUNITY_ONLY, INVITE_ONLY], default: PUBLIC }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Must be later than startsAt. }
        timezone:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            description: Valid IANA time-zone identifier.,
          }
        capacity: { type: integer, minimum: 1 }
    Pagination:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    ReservationOutcomeResponse:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/ConfirmedOutcome'
            - $ref: '#/components/schemas/WaitlistedOutcome'
    ConfirmedOutcome:
      type: object
      required: [attendanceStatus, reservationId]
      properties:
        attendanceStatus: { type: string, enum: [CONFIRMED] }
        reservationId: { type: string, format: uuid }
    WaitlistedOutcome:
      type: object
      required: [attendanceStatus, waitlistEntryId, position]
      properties:
        attendanceStatus: { type: string, enum: [WAITLISTED] }
        waitlistEntryId: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
    ReservationResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Reservation' } }
    Reservation:
      type: object
      required: [id, status, reservedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [CONFIRMED] }
        reservedAt: { type: string, format: date-time }
    WaitlistEntryResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/WaitlistEntry' } }
    WaitlistEntry:
      type: object
      required: [id, status, joinedAt, position]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [WAITING] }
        joinedAt: { type: string, format: date-time }
        position: { type: integer, minimum: 1 }
  responses:
    Error:
      description: Safe machine-readable error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthenticationRequired:
